# Docker workflow
name: Docker workflows
on:
    # Run this workflow when a new release is published
  release:
    types: [published]
    # permission is given to read the release the contents
permissions:
  contents: read
jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:

      # --------------------------------------------------
      # 1. Checkout the exact release tag
      # --------------------------------------------------
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # --------------------------------------------------
      # 2. # Get the commit SHA of the release
      # --------------------------------------------------
      - name: Get commit SHA
        id: sha
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "Commit SHA: $SHORT_SHA"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
      

        # Step 1: Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME}}
            password: ${{ secrets.DOCKERHUB_TOKEN}}
        # step 2 setup Docker buildx plugin to build multi-platform images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # step 3: create short commit SHA for tagging the image
      # Changed: build the backend image locally so it can be scanned before publication.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
            context: ./backend
            load: true
            tags: |
                bishalmainali/std-backend:latest
                bishalmainali/std-backend:${{steps.sha.outputs.short_sha }}
                bishalmainali/std-backend:${{ github.event.release.tag_name}}
            cache-from: type=gha
            cache-to: type=gha,mode=max

      # Changed: security scan runs before the backend image is pushed to Docker Hub.
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
            image-ref: bishalmainali/std-backend:${{ steps.sha.outputs.short_sha }}
            format: table
            exit-code: '1'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH'

      # Changed: push the backend image only after its Trivy scan succeeds.
      - name: Push backend image to Docker Hub
        run: |
          docker push bishalmainali/std-backend:latest
          docker push bishalmainali/std-backend:${{ steps.sha.outputs.short_sha }}
          docker push bishalmainali/std-backend:${{ github.event.release.tag_name }}

      # Changed: build the frontend image locally so it can be scanned before publication.
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
            context: ./frontend
            load: true
            tags: |
                bishalmainali/std-frontend:latest
                bishalmainali/std-frontend:${{steps.sha.outputs.short_sha }}
                bishalmainali/std-frontend:${{ github.event.release.tag_name}}
            cache-from: type=gha
            cache-to: type=gha,mode=max

      # Changed: security scan runs before the frontend image is pushed to Docker Hub.
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
            image-ref: bishalmainali/std-frontend:${{ steps.sha.outputs.short_sha }}
            format: table
            exit-code: '1'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH'

      # Changed: push the frontend image only after its Trivy scan succeeds.
      - name: Push frontend image to Docker Hub
        run: |
          docker push bishalmainali/std-frontend:latest
          docker push bishalmainali/std-frontend:${{ steps.sha.outputs.short_sha }}
          docker push bishalmainali/std-frontend:${{ github.event.release.tag_name }}
            
